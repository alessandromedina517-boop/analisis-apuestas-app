<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚽ Análisis de Apuestas REAL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #faf9f8; color: #0b0b0b; }
    .container { max-width: 700px; margin: 0 auto; }
    .header { background: #fcfcfb; border-bottom: 1px solid #e0e0e0; padding: 1rem; text-align: center; }
    .header h1 { font-size: 18px; color: #378add; margin-bottom: 4px; }
    .header p { font-size: 11px; color: #888; }
    .content { padding: 1rem; min-height: calc(100vh - 200px); }
    .card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .match-card { border: 2px solid #e0e0e0; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .match-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem; }
    .teams { flex: 1; }
    .team-vs { font-size: 13px; color: #888; margin-bottom: 6px; }
    .team-names { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .status-badge { background: #eaf3de; color: #0ca30c; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
    .odds-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
    .odd-box { text-align: center; padding: 8px; background: #f5f5f5; border-radius: 6px; }
    .odd-label { font-size: 11px; color: #888; margin-bottom: 4px; }
    .odd-value { font-weight: 600; font-size: 18px; color: #378add; }
    .probability { font-size: 10px; color: #0ca30c; margin-top: 2px; }
    .loading { text-align: center; padding: 2rem; color: #888; }
    .error { background: #fcebeb; color: #d03b3b; padding: 1rem; border-radius: 6px; margin: 1rem; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #fcfcfb; border-top: 1px solid #e0e0e0; }
    .tab { padding: 12px; text-align: center; cursor: pointer; border: none; background: transparent; font-size: 16px; }
    .tab.active { background: white; border-bottom: 2px solid #378add; }
    input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #378add; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
    button:hover { background: #2a6ab8; }
    .login-container { max-width: 360px; margin: 100px auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .demo { background: #e6f1fb; color: #378add; padding: 12px; border-radius: 6px; font-size: 12px; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    let user = null;
    let matches = [];
    let activeTab = 'matches';
    const app = document.getElementById('app');

    function renderLogin() {
      app.innerHTML = `
        <div class="login-container">
          <h1 style="text-align: center; color: #378add; margin-bottom: 1rem;">⚽ Análisis de Apuestas</h1>
          <p style="text-align: center; color: #888; margin-bottom: 1rem; font-size: 12px;">Datos EN VIVO + Análisis Estadístico</p>
          <input type="email" id="email" placeholder="correo@ejemplo.com">
          <input type="password" id="password" placeholder="contraseña">
          <button onclick="handleLogin()">Iniciar sesión</button>
          <div class="demo">💡 Demo: usa cualquier correo/contraseña</div>
        </div>
      `;
      document.getElementById('email').focus();
    }

    function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (email && password) {
        user = { email, name: email.split('@')[0] };
        loadMatches();
      } else {
        alert('Completa los campos');
      }
    }

    async function loadMatches() {
      app.innerHTML = `<div class="loading">⏳ Cargando partidos EN VIVO...</div>`;
      try {
        const response = await fetch('/api/matches');
        const data = await response.json();
        matches = data.matches || [];
        renderApp();
      } catch (error) {
        app.innerHTML = `<div class="error">Error al cargar: ${error.message}</div>`;
      }
    }

    function renderApp() {
      let content = '';

      if (activeTab === 'matches') {
        if (matches.length === 0) {
          content = `<div class="card" style="text-align: center; color: #888;">No hay partidos disponibles ahora</div>`;
        } else {
          content = matches.map(m => `
            <div class="match-card">
              <div class="match-header">
                <div class="teams" style="flex: 1;">
                  <div class="team-vs">${m.competition}</div>
                  <div class="team-names">${m.homeTeam} vs ${m.awayTeam}</div>
                  <div style="font-size: 11px; color: #888;">${new Date(m.date).toLocaleString('es-PE')}</div>
                </div>
                <div class="status-badge">${m.status === 'LIVE' || m.status === 'IN_PLAY' ? '🔴 EN VIVO' : '📅'}</div>
              </div>
              
              <h4 style="font-size: 12px; margin-bottom: 8px; color: #888;">📊 Probabilidades estadísticas</h4>
              <div class="odds-grid">
                <div class="odd-box">
                  <div class="odd-label">1 (${m.homeTeam})</div>
                  <div class="odd-value">${m.fairOdds['1']}</div>
                  <div class="probability">↓ ${m.probabilities.home}%</div>
                </div>
                <div class="odd-box">
                  <div class="odd-label">X (Empate)</div>
                  <div class="odd-value">${m.fairOdds['X']}</div>
                  <div class="probability">↓ ${m.probabilities.draw}%</div>
                </div>
                <div class="odd-box">
                  <div class="odd-label">2 (${m.awayTeam})</div>
                  <div class="odd-value">${m.fairOdds['2']}</div>
                  <div class="probability">↓ ${m.probabilities.away}%</div>
                </div>
              </div>
              
              <div style="font-size: 11px; color: #888; padding-top: 8px; border-top: 1px solid #e0e0e0;">
                💡 Comparar estas cuotas "justas" con Betano/1xBet. Si Betano ofrece mayor cuota = VALOR
              </div>
            </div>
          `).join('');
        }
      } else if (activeTab === 'analysis') {
        content = `
          <div class="card" style="background: #eaf3de; border-color: #0ca30c;">
            <h3 style="color: #0ca30c; margin-bottom: 8px;">✅ Sistema REAL conectado</h3>
            <p style="color: #0ca30c; font-size: 13px; line-height: 1.5;">
              ✓ Partidos EN VIVO de Football-Data.org<br>
              ✓ Cálculo estadístico automático<br>
              ✓ Cuotas "justas" por probabilidad<br>
              ✓ Actualización cada 30 segundos<br>
              ✓ Detecta oportunidades de valor
            </p>
          </div>
          
          <div class="card">
            <h4 style="margin-bottom: 10px;">📖 Cómo usar:</h4>
            <ol style="font-size: 13px; line-height: 1.8; color: #888;">
              <li>Mira los partidos y sus cuotas "justas"</li>
              <li>Abre Betano/1xBet en otra pestaña</li>
              <li>Compara: ¿Betano ofrece MAYOR cuota?</li>
              <li>Si sí = esa apuesta tiene VALOR</li>
              <li>Ejemplo: Cuota justa 2.0, Betano ofrece 2.15 = VALOR +7.5%</li>
            </ol>
          </div>
        `;
      }

      app.innerHTML = `
        <div class="container">
          <div class="header">
            <h1>⚽ Análisis de Apuestas</h1>
            <p>🔴 DATOS EN VIVO + Estadísticas 🇵🇪</p>
          </div>
          <div class="content">${content}</div>
          <div class="tabs">
            <button class="tab ${activeTab === 'matches' ? 'active' : ''}" onclick="switchTab('matches')">📊 Partidos</button>
            <button class="tab ${activeTab === 'analysis' ? 'active' : ''}" onclick="switchTab('analysis')">📈 Cómo usar</button>
          </div>
        </div>
      `;
    }

    function switchTab(tab) {
      activeTab = tab;
      renderApp();
    }

    renderLogin();
  </script>
</body>
</html>
