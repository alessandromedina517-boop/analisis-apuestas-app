<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚽ Análisis de Apuestas PRO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #faf9f8; color: #0b0b0b; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { background: #fcfcfb; border-bottom: 1px solid #e0e0e0; padding: 1rem; text-align: center; }
    .header h1 { font-size: 18px; color: #378add; margin-bottom: 4px; }
    .header p { font-size: 11px; color: #888; }
    .content { padding: 1rem; min-height: calc(100vh - 200px); }
    .match-card { border: 2px solid #378add; border-radius: 8px; padding: 1.2rem; margin-bottom: 1.5rem; background: white; }
    .match-header { padding-bottom: 1rem; border-bottom: 2px solid #e0e0e0; margin-bottom: 1rem; }
    .team-vs { font-size: 12px; color: #888; font-weight: 500; margin-bottom: 4px; }
    .team-names { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .status-badge { display: inline-block; background: #eaf3de; color: #0ca30c; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
    .mercado { margin-bottom: 1.2rem; padding-bottom: 1rem; border-bottom: 1px solid #f0f0f0; }
    .mercado-titulo { font-size: 12px; font-weight: 700; color: #378add; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .mercado-icon { font-size: 14px; }
    .opciones { display: grid; gap: 8px; }
    .opcion { padding: 10px; background: #f5f5f5; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e0e0e0; cursor: pointer; transition: all 0.2s; }
    .opcion:hover { background: #eef5ff; border-color: #378add; }
    .opcion-left { flex: 1; }
    .opcion-nombre { font-size: 12px; color: #0b0b0b; font-weight: 500; margin-bottom: 2px; }
    .opcion-prob { font-size: 10px; color: #888; }
    .opcion-cuota { font-weight: 700; font-size: 16px; color: #378add; }
    .tabs { display: grid; grid-template-columns: repeat(2, 1fr); background: #fcfcfb; border-top: 1px solid #e0e0e0; }
    .tab { padding: 12px; text-align: center; cursor: pointer; border: none; background: transparent; font-size: 14px; }
    .tab.active { background: white; border-bottom: 2px solid #378add; }
    input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #378add; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .login-container { max-width: 360px; margin: 100px auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .demo { background: #e6f1fb; color: #378add; padding: 12px; border-radius: 6px; font-size: 12px; text-align: center; margin-top: 12px; }
    .loading { text-align: center; padding: 2rem; color: #888; }
    .card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .stats-box { background: #f9f9f9; border-left: 3px solid #378add; padding: 10px; margin-top: 1rem; font-size: 12px; }
    .stats-row { display: flex; justify-content: space-between; padding: 4px 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    let user = null;
    let matches = [];
    let activeTab = 'matches';
    const app = document.getElementById('app');

    function renderLogin() {
      app.innerHTML = `
        <div class="login-container">
          <h1 style="text-align: center; color: #378add; margin-bottom: 1rem;">⚽ Análisis de Apuestas</h1>
          <p style="text-align: center; color: #888; margin-bottom: 1rem; font-size: 12px;">7 Mercados Profesionales + Estadísticas</p>
          <input type="email" id="email" placeholder="correo@ejemplo.com">
          <input type="password" id="password" placeholder="contraseña">
          <button onclick="handleLogin()">Iniciar sesión</button>
          <div class="demo">💡 Demo: usa cualquier correo/contraseña</div>
        </div>
      `;
      document.getElementById('email').focus();
    }

    function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (email && password) {
        user = { email, name: email.split('@')[0] };
        loadMatches();
      }
    }

    async function loadMatches() {
      app.innerHTML = `<div class="loading">⏳ Cargando partidos con 7 mercados...</div>`;
      try {
        const response = await fetch('/api/matches');
        const data = await response.json();
        matches = data.matches || [];
        renderApp();
      } catch (error) {
        app.innerHTML = `<div class="card" style="background: #fcebeb; color: #d03b3b;">Error: ${error.message}</div>`;
      }
    }

    function renderMercado(nombre, icon, opciones) {
      return `
        <div class="mercado">
          <div class="mercado-titulo">
            <span class="mercado-icon">${icon}</span>
            <span>${nombre}</span>
          </div>
          <div class="opciones">
            ${opciones.map(op => `
              <div class="opcion">
                <div class="opcion-left">
                  <div class="opcion-nombre">${op.nombre}</div>
                  <div class="opcion-prob">↓ ${op.prob}%</div>
                </div>
                <div class="opcion-cuota">${op.cuota}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderApp() {
      let content = '';

      if (activeTab === 'matches') {
        if (matches.length === 0) {
          content = `<div class="card" style="text-align: center; color: #888;">No hay partidos EN VIVO ahora</div>`;
        } else {
          content = matches.map(m => `
            <div class="match-card">
              <div class="match-header">
                <div class="team-vs">${m.competition}</div>
                <div class="team-names">${m.homeTeam} vs ${m.awayTeam}</div>
                <div style="font-size: 11px; color: #888; margin-top: 6px;">${new Date(m.date).toLocaleString('es-PE')}</div>
                <div style="margin-top: 6px;">
                  <span class="status-badge">${m.status === 'LIVE' || m.status === 'IN_PLAY' ? '🔴 EN VIVO' : '📅'}</span>
                </div>
              </div>
              
              ${renderMercado('Ganador (1x2)', '🏆', [
                { nombre: '1 - ' + m.homeTeam, cuota: m.mercado1x2['1'].cuota, prob: m.mercado1x2['1'].probabilidad },
                { nombre: 'X - Empate', cuota: m.mercado1x2['X'].cuota, prob: m.mercado1x2['X'].probabilidad },
                { nombre: '2 - ' + m.awayTeam, cuota: m.mercado1x2['2'].cuota, prob: m.mercado1x2['2'].probabilidad }
              ])}
              
              ${renderMercado('Over/Under 2.5 Goles', '⚽', [
                { nombre: 'Over 2.5', cuota: m.overUnder25['Over2.5'].cuota, prob: m.overUnder25['Over2.5'].probabilidad },
                { nombre: 'Under 2.5', cuota: m.overUnder25['Under2.5'].cuota, prob: m.overUnder25['Under2.5'].probabilidad }
              ])}
              
              ${renderMercado('Ambos Equipos Anotan', '⚽⚽', [
                { nombre: 'Sí', cuota: m.bothScore['Sí'].cuota, prob: m.bothScore['Sí'].probabilidad },
                { nombre: 'No', cuota: m.bothScore['No'].cuota, prob: m.bothScore['No'].probabilidad }
              ])}
              
              ${renderMercado('Corners O/U 8.5', '🚩', [
                { nombre: 'Over 8.5', cuota: m.overUnderCorners['Over8.5'].cuota, prob: m.overUnderCorners['Over8.5'].probabilidad },
                { nombre: 'Under 8.5', cuota: m.overUnderCorners['Under8.5'].cuota, prob: m.overUnderCorners['Under8.5'].probabilidad }
              ])}
              
              ${renderMercado('Remates O/U 21.5', '🎯', [
                { nombre: 'Over 21.5', cuota: m.overUnderShots['Over21.5'].cuota, prob: m.overUnderShots['Over21.5'].probabilidad },
                { nombre: 'Under 21.5', cuota: m.overUnderShots['Under21.5'].cuota, prob: m.overUnderShots['Under21.5'].probabilidad }
              ])}
              
              ${renderMercado('Remates a Puerta O/U 7.5', '🎪', [
                { nombre: 'Over 7.5', cuota: m.overUnderSoT['Over7.5'].cuota, prob: m.overUnderSoT['Over7.5'].probabilidad },
                { nombre: 'Under 7.5', cuota: m.overUnderSoT['Under7.5'].cuota, prob: m.overUnderSoT['Under7.5'].probabilidad }
              ])}
              
              ${renderMercado('Handicap Asiático', '⚖️', [
                { nombre: m.handicap['-1.5'].desc, cuota: m.handicap['-1.5'].cuota, prob: m.handicap['-1.5'].probabilidad },
                { nombre: m.handicap['-1'].desc, cuota: m.handicap['-1'].cuota, prob: m.handicap['-1'].probabilidad },
                { nombre: m.handicap['0'].desc, cuota: m.handicap['0'].cuota, prob: m.handicap['0'].probabilidad },
                { nombre: m.handicap['+1'].desc, cuota: m.handicap['+1'].cuota, prob: m.handicap['+1'].probabilidad }
              ])}
              
              <div class="stats-box">
                <strong>📊 Estadísticas Estimadas:</strong>
                <div class="stats-row">
                  <span>Goles promedio: ${m.stats.promedioGoles}</span>
                  <span>Corners est.: ${m.stats.cornersLocal.split('.')[0]} - ${m.stats.cornersVisita.split('.')[0]}</span>
                </div>
                <div class="stats-row">
                  <span>Remates: ${m.stats.rematesLocal.split('.')[0]} - ${m.stats.rematesVisita.split('.')[0]}</span>
                  <span>Remates puerta: ${m.stats.rematesAuertaLocal.split('.')[0]} - ${m.stats.rematesAuertaVisita.split('.')[0]}</span>
                </div>
              </div>
            </div>
          `).join('');
        }
      } else if (activeTab === 'info') {
        content = `
          <div class="card" style="background: #eaf3de; border-color: #0ca30c; border-left: 4px solid #0ca30c;">
            <h3 style="color: #0ca30c; margin-bottom: 12px; font-size: 14px;">✅ 7 Mercados Profesionales</h3>
            <ol style="color: #0ca30c; font-size: 13px; line-height: 2; padding-left: 20px;">
              <li><strong>Ganador (1x2):</strong> Quién gana</li>
              <li><strong>Over/Under 2.5:</strong> Goles totales</li>
              <li><strong>Ambos Anotan:</strong> ¿Marcan dos?</li>
              <li><strong>Corners O/U 8.5:</strong> Esquinas</li>
              <li><strong>Remates O/U 21.5:</strong> Disparos totales</li>
              <li><strong>Remates Puerta O/U 7.5:</strong> A portería</li>
              <li><strong>Handicap Asiático:</strong> Ventaja goles</li>
            </ol>
          </div>
          
          <div class="card">
            <h4 style="margin-bottom: 10px; color: #378add;">💡 Estrategia Profesional:</h4>
            <p style="font-size: 13px; line-height: 1.8; color: #666;">
              <strong>1. Lee la cuota "justa"</strong> que calcula la app<br>
              <strong>2. Abre Betano/1xBet</strong> en otra pestaña<br>
              <strong>3. Compara cuotas:</strong> ¿Betano ofrece MÁS?<br>
              <strong>4. Si ofrece más = VALOR</strong> (esa es tu apuesta)<br>
              <strong>5. Ej:</strong> App dice 2.0, Betano 2.15 = +7.5% valor
            </p>
          </div>
          
          <div class="card" style="background: #fcfbf0; border-left: 3px solid #ba7517;">
            <h4 style="margin-bottom: 10px; color: #ba7517;">⚠️ Importantes:</h4>
            <ul style="font-size: 12px; color: #ba7517; line-height: 1.8; padding-left: 20px;">
              <li>Las probabilidades son ESTIMADAS (no datos reales)</li>
              <li>Las cuotas "justas" usan cálculos estadísticos</li>
              <li>El valor real depende de Betano/1xBet</li>
              <li>Siempre compara con las casas antes de apostar</li>
            </ul>
          </div>
        `;
      }

      app.innerHTML = `
        <div class="container">
          <div class="header">
            <h1>⚽ Análisis de Apuestas PRO</h1>
            <p>🔴 7 MERCADOS + Estadísticas Avanzadas 🇵🇪</p>
          </div>
          <div class="content">${content}</div>
          <div class="tabs">
            <button class="tab ${activeTab === 'matches' ? 'active' : ''}" onclick="switchTab('matches')">📊 Partidos</button>
            <button class="tab ${activeTab === 'info' ? 'active' : ''}" onclick="switchTab('info')">📖 Guía</button>
          </div>
        </div>
      `;
    }

    function switchTab(tab) {
      activeTab = tab;
      renderApp();
    }

    renderLogin();
  </script>
</body>
</html>
